name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.26.1 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm build:mobile
      - run: pnpm verify:web
      - run: pnpm verify:http
      # The MVP gate. Starts two relays on separate databases and walks the
      # whole journey, so a change that breaks the crossing fails here rather
      # than being found by hand later.
      - run: pnpm verify:journey
      - run: pnpm infra:synth
