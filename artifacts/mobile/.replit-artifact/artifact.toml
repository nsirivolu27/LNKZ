kind = "mobile"
previewPath = "/mobile/"
title = "LNKZ Mobile"
description = "A mobile-first companion for capturing conversations, searching the LNKZ library, building context packets, and creating secure handoff links through an existing LNKZ relay server."
version = "1.0.0"
id = "artifacts/mobile"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/mobile/", "/artifacts/mobile/", "/assets/" ]
localPort = 18115

[services.development]
run = "pnpm --filter @workspace/mobile run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/mobile", "run", "build" ]
run = [ "node", "artifacts/mobile/server/serve.js" ]

[services.env]
PORT = "18115"
BASE_PATH = "/mobile/"