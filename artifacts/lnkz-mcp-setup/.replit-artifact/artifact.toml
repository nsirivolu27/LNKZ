kind = "web"
previewPath = "/lnkz-mcp-setup/"
title = "LNKZ MCP Setup"
description = "A public, credential-safe setup page for connecting an LNKZ relay to an MCP client."
version = "1.0.0"
id = "artifacts/lnkz-mcp-setup"
router = "path"

[[services]]
name = "web"
paths = [ "/lnkz-mcp-setup/" ]
localPort = 18682

[services.development]
run = "pnpm --filter @workspace/lnkz-mcp-setup run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/lnkz-mcp-setup", "run", "build" ]
serve = "static"
publicDir = "artifacts/lnkz-mcp-setup/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "18682"
BASE_PATH = "/lnkz-mcp-setup/"
